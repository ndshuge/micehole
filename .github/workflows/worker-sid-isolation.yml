name: Verify disposable Windows Worker SID isolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-identity-fixture:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows Job Object process tree containment
        shell: powershell
        run: .\scripts\tests\verify-worker-job-ci.ps1
      - name: Verify actual separate Windows LocalService SID and protected dummy credential
        shell: powershell
        run: .\scripts\tests\verify-worker-service-identity-ci.ps1
      - name: Verify real Windows named-pipe DACL and actual LocalService peer SID
        shell: powershell
        run: .\scripts\tests\verify-worker-pipe-acl-ci.ps1
      - name: Upload security evidence (no keys or private files)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-sid-isolation-evidence
          path: |
            qa-fixture/worker-sid-ci-proof.json
            qa-fixture/worker-pipe-ci-proof.json
          if-no-files-found: warn
          retention-days: 7
