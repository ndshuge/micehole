name: Universal MCP smoke tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run local isolated MCP tests
        run: node scripts/smoke-test.mjs
      - name: Run isolated security regression tests
        run: node scripts/security-test.mjs
      - name: Verify experimental broker/worker local IPC safety
        run: node scripts/tests/worker-ipc.test.mjs
      - name: Observe genuine Windows named-pipe client SID (same-user negative control)
        shell: powershell
        run: .\scripts\tests\verify-windows-pipe-peer.ps1
      - name: Fail-closed Windows pipe attestor same-user rejection
        shell: powershell
        run: |
          Add-Type -Path src\worker\WindowsPipeAttestor.cs -ErrorAction Stop
          if (-not [MiceHole.SecurityExperiment.WindowsPipeAttestor]::RejectSameUserClient()) { throw 'A same-user peer bypassed Windows SID gate' }
          Write-Output 'BROKER_PIPE_SAME_USER_NEGATIVE=PASS'
      - name: Verify Windows Job Object process wait, timeout and descendant cleanup
        shell: powershell
        run: .\scripts\tests\verify-worker-job-ci.ps1
      - name: Validate Personal Tunnel onboarding scripts
        shell: powershell
        run: .\scripts\check-remote-syntax.ps1
      - name: Download verified official tunnel-client
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\fetch-tunnel-client.ps1
      - name: Build portable distribution without Inno Setup
        shell: powershell
        run: .\scripts\build-release.ps1 -ZipOnly
      - name: Test the ZIP with its bundled Node runtime
        shell: powershell
        run: .\scripts\verify-portable.ps1
      - name: Test remote safe mode (no shared-key shell privilege)
        run: node scripts/remote-safe-test.mjs dist/stage
      - name: Verify installation and uninstall safety contract
        shell: powershell
        run: .\scripts\verify-installer-contract.ps1
      - name: Validate personal Tunnel offline first-run configuration
        shell: powershell
        run: .\scripts\verify-tunnel-onboarding.ps1
      - name: Test Supervisor crash and recovery with isolated fake Tunnel
        shell: powershell
        run: .\scripts\tests\verify-supervisor.ps1
      - name: Verify optional Azure VM reboot workflow safety (offline)
        shell: powershell
        run: .\scripts\cloud\verify-cloud-workflow.ps1
      - name: Scan tracked files for accidental secrets
        run: node scripts/public-preflight.mjs
      - name: Publish development and verification summary
        if: always()
        shell: powershell
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          $short = $env:GITHUB_SHA.Substring(0,8)
          @(
            '## MiceHole · Windows verification'
            ''
            ('- Commit: `' + $short + '`')
            ('- Workflow outcome: **' + $env:VERIFICATION_STATUS + '**')
            '- Scope: local MCP, Windows path safety, worker IPC fixture, native peer SID negative test, portable ZIP, personal Tunnel offline setup, watchdog simulated recovery, publish preflight.'
            '- Real distinct-SID disposable worker test is a separate workflow; passing this workflow is NOT production security approval.'
            '- Actual Windows reboot and separate-user ChatGPT pairing are NOT validated here.'
            ''
            '- [Development journal](https://github.com/ndshuge/micehole/blob/main/docs/DEVLOG.md)'
            '- [Current issues](https://github.com/ndshuge/micehole/issues)'
            '- [Release gates](https://github.com/ndshuge/micehole/blob/main/docs/RELEASE.md)'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
